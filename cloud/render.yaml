# Render Blueprint: New > Blueprint, point it at this repo.
services:
  - type: web
    name: dlna-cloud
    runtime: docker
    rootDir: cloud
    dockerfilePath: ./Dockerfile
    plan: free # sleeps after ~15 min without HTTP requests; the agent's keep-alive ping prevents that
    healthCheckPath: /healthz
    envVars:
      - key: PAIRING_TOKEN
        sync: false # set it in the dashboard; never commit it
      - key: FORCE_HTTPS
        value: "1"
